<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<span class="navbar-brand">
Admin Dashboard
</span>

<button
class="btn btn-danger"
onclick="logout()"
>
Logout
</button>

</div>

</nav>

<div class="container mt-4">

<div class="row">

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h5>Total Students</h5>

<h2 id="studentsCount">
0
</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h5>Total Jobs</h5>

<h2 id="jobsCount">
0
</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h5>Total Applications</h5>

<h2 id="applicationsCount">
0
</h2>

</div>

</div>

</div>

</div>

</div>

<div class="container mt-5">

  <h3>All Students</h3>

  <table class="table table-bordered">

    <thead>

      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>

    </thead>

    <tbody id="studentsTableBody">

    </tbody>

  </table>

</div>

<script>

async function loadDashboard() {

  const token = localStorage.getItem("token");

  const students = await fetch(
    "http://localhost:8080/api/students",
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const studentsData =
    await students.json();

  document.getElementById(
    "studentsCount"
  ).innerText =
  studentsData.students.length;

  const jobs =
    await fetch(
      "http://localhost:8080/api/jobs"
    );

  const jobsData =
    await jobs.json();

  document.getElementById(
    "jobsCount"
  ).innerText =
  jobsData.jobs.length;

  const applications =
    await fetch(
      "http://localhost:8080/api/applications"
    );

  const applicationsData =
    await applications.json();

  document.getElementById(
    "applicationsCount"
  ).innerText =
  applicationsData.applications.length;

}

async function loadStudents() {

  const token =
    localStorage.getItem("token");

  const response = await fetch(
    "http://localhost:8080/api/students",
    {
      headers: {
        Authorization:
        `Bearer ${token}`
      }
    }
  );

  const data =
    await response.json();

  const tableBody =
    document.getElementById(
      "studentsTableBody"
    );

  tableBody.innerHTML = "";

  data.students.forEach(student => {

    tableBody.innerHTML += `
      <tr>
        <td>${student.fullName}</td>
        <td>${student.email}</td>
      </tr>
    `;

  });

}

loadDashboard();
loadStudents();

function logout(){

  localStorage.clear();

  window.location.href =
  "login.html";

}

</script>

</body>
</html>
