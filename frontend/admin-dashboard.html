<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg-primary: #f8fafc;
    --sidebar-bg: #0f172a;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --accent-color: #4f46e5;
    --border-radius: 12px;
    --transition: all 0.3s ease;
  }

  body {
    background-color: var(--bg-primary);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
  }

  /* Navbar styling */
  .navbar {
    background-color: var(--sidebar-bg) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    padding: 1rem 0;
  }
  .navbar-brand {
    font-weight: 700;
    letter-spacing: -0.5px;
    font-size: 1.4rem;
    background: linear-gradient(to right, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .btn-danger {
    background-color: #ef4444;
    border: none;
    border-radius: 8px;
    font-weight: 500;
    padding: 0.5rem 1.25rem;
    transition: var(--transition);
  }
  .btn-danger:hover {
    background-color: #dc2626;
    transform: translateY(-1px);
  }

  /* Section Headings */
  h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--sidebar-bg);
    margin-bottom: 1.5rem;
    position: relative;
    padding-left: 12px;
  }
  h3::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    height: 18px;
    width: 4px;
    background: var(--accent-color);
    border-radius: 4px;
  }

  /* Dashboard Cards */
  .card {
    background: var(--card-bg);
    border: 1px solid #e2e8f0;
    border-radius: var(--border-radius);
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    transition: var(--transition);
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  }
  .card-body {
    padding: 1.5rem;
  }
  .card h5 {
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .card h2 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--sidebar-bg);
    margin: 0;
  }

  /* Graph Panels */
  .col-md-6 canvas {
    background: var(--card-bg);
    padding: 1.5rem;
    border-radius: var(--border-radius);
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    max-height: 320px;
  }

  /* Forms styling */
  #companyForm {
    background: var(--card-bg);
    padding: 2rem;
    border-radius: var(--border-radius);
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  #companyForm .form-control {
    flex: 1;
    min-width: 200px;
    margin-bottom: 0 !important;
    padding: 0.625rem 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: var(--transition);
  }
  #companyForm .form-control:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    outline: none;
  }
  #companyForm .btn-primary {
    background-color: var(--accent-color);
    border: none;
    padding: 0.625rem 1.5rem;
    border-radius: 8px;
    font-weight: 500;
    transition: var(--transition);
  }
  #companyForm .btn-primary:hover {
    background-color: #4338ca;
    transform: translateY(-1px);
  }

  /* Modern Tables */
  .table-container {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    overflow: hidden;
    margin-bottom: 2rem;
  }
  .table {
    margin-bottom: 0;
    border: none !important;
  }
  .table thead th {
    background-color: #f8fafc;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e2e8f0;
  }
  .table tbody td {
    padding: 1rem 1.5rem;
    vertical-align: middle;
    color: var(--text-main);
    font-size: 0.95rem;
    border-bottom: 1px solid #f1f5f9;
    border-top: none !important;
    border-left: none !important;
    border-right: none !important;
  }
  .table tbody tr:last-child td {
    border-bottom: none;
  }
  .table tbody tr:hover {
    background-color: #f8fafc;
  }

  /* Table Button Customizations */
  .table .btn-success {
    background-color: #bbf7d0;
    color: #166534;
    border: none;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
  }
  .table .btn-success:hover {
    background-color: #86efac;
    color: #14532d;
  }
  .table .btn-danger {
    background-color: #fee2e2;
    color: #991b1b;
    border: none;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
  }
  .table .btn-danger:hover {
    background-color: #fca5a5;
    color: #7f1d1d;
  }
</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid px-5">

<span class="navbar-brand">
Admin Dashboard
</span>

<button
class="btn btn-danger"
onclick="logout()"
>
Logout
</button>

</div>

</nav>

<div class="container mt-4">

<div class="row g-3">

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Total Students</h5>
<h2 id="studentsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Total Jobs</h5>
<h2 id="jobsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Total Applications</h5>
<h2 id="applicationsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Placed Students</h5>
<h2 id="placedCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Placement</h5>
<h2 id="placementPercentage">0%</h2>
</div>
</div>
</div>

</div>

</div>

<div class="container mt-5">

  <h3>Application Analytics</h3>

  <div class="row">

    <div class="col-md-6">
      <canvas id="applicationChart"></canvas>
    </div>

    <div class="col-md-6">
      <canvas id="placementChart"></canvas>
    </div>

  </div>

</div>

<div class="container mt-5">

<h3>Add Company</h3>

<form id="companyForm">

<input
type="text"
id="companyName"
class="form-control mb-2"
placeholder="Company Name"
required
>

<input
type="email"
id="companyEmail"
class="form-control mb-2"
placeholder="Company Email"
required
>

<input
type="password"
id="companyPassword"
class="form-control mb-2"
placeholder="Password"
required
>

<button
type="submit"
class="btn btn-primary"
>
Create Company
</button>

</form>

</div>

 <div class="container mt-5">

<h3>All Students</h3>

<div class="table-container">
<table class="table table-bordered">

<thead>
<tr>
  <th>Name</th>
  <th>Email</th>
  <th>Branch</th>
  <th>CGPA</th>
  <th>Skills</th>
  <th>Resume</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="studentsTableBody">
</tbody>

</table>
</div>

</div>

<div class="container mt-5">

  <h3>Companies</h3>

  <div class="table-container">
  <table class="table table-bordered">

    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody id="companiesTableBody">

    </tbody>

  </table>
  </div>

</div>

<div class="container mt-5">

  <h3>All Applications</h3>

  <div class="table-container">
  <table class="table table-bordered">

    <thead>
<tr>
  <th>Student Name</th>
<th>Company</th>
<th>Job Title</th>
<th>Status</th>
</tr>
</thead>

    <tbody id="applicationsTableBody">

    </tbody>

  </table>
  </div>

</div>


<script>

async function loadDashboard() {

  const token = localStorage.getItem("token");

  const studentsResponse =
    await fetch(
      "/api/students",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

  const studentsData =
    await studentsResponse.json();

  document.getElementById(
    "studentsCount"
  ).innerText =
  studentsData.students.length;

  const jobsResponse =
    await fetch(
      "/api/jobs"
    );

  const jobsData =
    await jobsResponse.json();

  document.getElementById(
    "jobsCount"
  ).innerText =
  jobsData.jobs.length;

  const applicationsResponse =
    await fetch(
      "/api/applications"
    );

  const applicationsData =
    await applicationsResponse.json();

  document.getElementById(
    "applicationsCount"
  ).innerText =
  applicationsData.applications.length;

  const placed =
    applicationsData.applications.filter(
      app =>
      app.status === "Selected"
    );

  document.getElementById(
    "placedCount"
  ).innerText =
  placed.length;

  const placementPercentage =
    studentsData.students.length > 0
    ? (
        placed.length /
        studentsData.students.length
      ) * 100
    : 0;

  document.getElementById(
    "placementPercentage"
  ).innerText =
  placementPercentage.toFixed(1) + "%";

}

async function loadStudents() {

  const token =
    localStorage.getItem("token");

  const response =
    await fetch(
      "/api/students",
      {
        headers: {
          Authorization:
          `Bearer ${token}`
        }
      }
    );

  const data =
    await response.json();

  const tableBody =
    document.getElementById(
      "studentsTableBody"
    );

  tableBody.innerHTML = "";

  data.students.forEach(student => {

tableBody.innerHTML += `
<tr>

<td>${student.fullName}</td>

<td>${student.email}</td>

<td>${student.branch || "N/A"}</td>

<td>${student.cgpa || "N/A"}</td>

<td>
${student.skills?.join(", ") || "N/A"}
</td>

<td>

${
student.resumeUrl
?
`<a
href="/uploads/${student.resumeUrl}"
target="_blank"
class="btn btn-success btn-sm"
>
View Resume
</a>`
:
"Not Uploaded"
}

</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="deleteStudent('${student._id}')"
>
Delete
</button>

</td>

</tr>
`;

  });

}

async function loadCompanies() {

  const token =
    localStorage.getItem("token");

  const response =
    await fetch(
      "/api/auth/companies",
      {
        headers: {
  Authorization: `Bearer ${token}`
}
      }
    );

  const data =
    await response.json();

  const table =
    document.getElementById(
      "companiesTableBody"
    );

  table.innerHTML = "";

  data.companies.forEach(company => {

    table.innerHTML += `
      <tr>
        <td>${company.name}</td>
        <td>${company.email}</td>
      </tr>
    `;

  });

}

async function loadApplications() {

  const response =
    await fetch(
      "/api/applications"
    );

  const data =
    await response.json();

  const tableBody =
    document.getElementById(
      "applicationsTableBody"
    );

  tableBody.innerHTML = "";

data.applications.forEach(app => {

  tableBody.innerHTML += `
    <tr>

      <td>
        ${app.studentId?.fullName || "N/A"}
      </td>

      <td>
        ${app.jobId?.companyId?.name || "N/A"}
      </td>

      <td>
        ${app.jobId?.title || "N/A"}
      </td>

      <td>
        ${app.status}
      </td>

    </tr>
  `;

});

}

document
.getElementById("companyForm")
.addEventListener(
"submit",
async function(e){

  e.preventDefault();

  const name =
    document.getElementById(
      "companyName"
    ).value;

  const email =
    document.getElementById(
      "companyEmail"
    ).value;

  const password =
    document.getElementById(
      "companyPassword"
    ).value;

  const response =
    await fetch(
      "/api/auth/register",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          name,
          email,
          password,
          role:"company"
        })
      }
    );

  const data =
    await response.json();

  if(data.success){

    alert(
      "Company Created"
    );

    document
      .getElementById(
        "companyForm"
      )
      .reset();

    loadCompanies();

  } else {

    alert(
      data.message
    );

  }

});

function logout(){

  localStorage.clear();

  window.location.href =
  "login.html";

}

async function loadAnalytics() {

  const response =
    await fetch(
      "/api/dashboard/summary"
    );

  const data =
    await response.json();

  const ctx1 =
    document
    .getElementById("applicationChart");

  new Chart(ctx1, {

    type: "bar",

    data: {

      labels: [
        "Applications",
        "Selected",
        "Rejected",
        "Shortlisted"
      ],

      datasets: [{
        label: "Applications",

        data: [
          data.applications,
          data.selected,
          data.rejected,
          data.shortlisted
        ]
      }]
    }
  });

  const ctx2 =
    document
    .getElementById("placementChart");

  new Chart(ctx2, {

    type: "pie",

    data: {

      labels: [
        "Placed",
        "Not Placed"
      ],

      datasets: [{

        data: [
          data.selected,
          data.students -
          data.selected
        ]

      }]
    }

  });

}

async function deleteStudent(studentId){

const confirmDelete =
confirm(
"Delete this student?"
);

if(!confirmDelete){
return;
}

try{

const token =
localStorage.getItem("token");

const response =
await fetch(
`/api/students/${studentId}`,
{
method:"DELETE",

headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

alert(data.message);

loadStudents();
loadDashboard();

}catch(error){

console.log(error);

}

}

loadDashboard();
loadStudents();
loadCompanies();
loadApplications();
loadAnalytics();

</script>


</body>
</html>
