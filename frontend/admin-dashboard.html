<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid px-5">

<span class="navbar-brand">
Admin Dashboard
</span>

<button
class="btn btn-danger"
onclick="logout()"
>
Logout
</button>

</div>

</nav>

<div class="container mt-4">

<div class="row g-3">

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Total Students</h5>
<h2 id="studentsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Total Jobs</h5>
<h2 id="jobsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Total Applications</h5>
<h2 id="applicationsCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Placed Students</h5>
<h2 id="placedCount">0</h2>
</div>
</div>
</div>

<div class="col-md-2">
<div class="card text-center">
<div class="card-body">
<h5>Placement</h5>
<h2 id="placementPercentage">0%</h2>
</div>
</div>
</div>

</div>

</div>

<div class="container mt-5">

  <h3>Application Analytics</h3>

  <div class="row">

    <div class="col-md-6">
      <canvas id="applicationChart"></canvas>
    </div>

    <div class="col-md-6">
      <canvas id="placementChart"></canvas>
    </div>

  </div>

</div>

<div class="container mt-5">

<h3>Add Company</h3>

<form id="companyForm">

<input
type="text"
id="companyName"
class="form-control mb-2"
placeholder="Company Name"
required
>

<input
type="email"
id="companyEmail"
class="form-control mb-2"
placeholder="Company Email"
required
>

<input
type="password"
id="companyPassword"
class="form-control mb-2"
placeholder="Password"
required
>

<button
type="submit"
class="btn btn-primary"
>
Create Company
</button>

</form>

</div>

 <div class="container mt-5">

<h3>All Students</h3>

<table class="table table-bordered">

<thead>
<tr>
  <th>Name</th>
  <th>Email</th>
  <th>Branch</th>
  <th>CGPA</th>
  <th>Skills</th>
  <th>Resume</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="studentsTableBody">
</tbody>

</table>

</div>

</div>

<div class="container mt-5">

  <h3>Companies</h3>

  <table class="table table-bordered">

    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody id="companiesTableBody">

    </tbody>

  </table>

</div>

<div class="container mt-5">

  <h3>All Applications</h3>

  <table class="table table-bordered">

    <thead>
<tr>
  <th>Student Name</th>
<th>Company</th>
<th>Job Title</th>
<th>Status</th>
</tr>
</thead>

    <tbody id="applicationsTableBody">

    </tbody>

  </table>

</div>


<script>

async function loadDashboard() {

  const token = localStorage.getItem("token");

  const studentsResponse =
    await fetch(
      "/api/students",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

  const studentsData =
    await studentsResponse.json();

  document.getElementById(
    "studentsCount"
  ).innerText =
  studentsData.students.length;

  const jobsResponse =
    await fetch(
      "/api/jobs"
    );

  const jobsData =
    await jobsResponse.json();

  document.getElementById(
    "jobsCount"
  ).innerText =
  jobsData.jobs.length;

  const applicationsResponse =
    await fetch(
      "/api/applications"
    );

  const applicationsData =
    await applicationsResponse.json();

  document.getElementById(
    "applicationsCount"
  ).innerText =
  applicationsData.applications.length;

  const placed =
    applicationsData.applications.filter(
      app =>
      app.status === "Selected"
    );

  document.getElementById(
    "placedCount"
  ).innerText =
  placed.length;

  const placementPercentage =
    studentsData.students.length > 0
    ? (
        placed.length /
        studentsData.students.length
      ) * 100
    : 0;

  document.getElementById(
    "placementPercentage"
  ).innerText =
  placementPercentage.toFixed(1) + "%";

}

async function loadStudents() {

  const token =
    localStorage.getItem("token");

  const response =
    await fetch(
      "/api/students",
      {
        headers: {
          Authorization:
          `Bearer ${token}`
        }
      }
    );

  const data =
    await response.json();

  const tableBody =
    document.getElementById(
      "studentsTableBody"
    );

  tableBody.innerHTML = "";

  data.students.forEach(student => {

tableBody.innerHTML += `
<tr>

<td>${student.fullName}</td>

<td>${student.email}</td>

<td>${student.branch || "N/A"}</td>

<td>${student.cgpa || "N/A"}</td>

<td>
${student.skills?.join(", ") || "N/A"}
</td>

<td>

${
student.resumeUrl
?
`<a
href="/uploads/${student.resumeUrl}"
target="_blank"
class="btn btn-success btn-sm"
>
View Resume
</a>`
:
"Not Uploaded"
}

</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="deleteStudent('${student._id}')"
>
Delete
</button>

</td>

</tr>
`;

  });

}

async function loadCompanies() {

  const token =
    localStorage.getItem("token");

  const response =
    await fetch(
      "/api/auth/companies",
      {
        headers: {
  Authorization: `Bearer ${token}`
}
      }
    );

  const data =
    await response.json();

  const table =
    document.getElementById(
      "companiesTableBody"
    );

  table.innerHTML = "";

  data.companies.forEach(company => {

    table.innerHTML += `
      <tr>
        <td>${company.name}</td>
        <td>${company.email}</td>
      </tr>
    `;

  });

}

async function loadApplications() {

  const response =
    await fetch(
      "/api/applications"
    );

  const data =
    await response.json();

  const tableBody =
    document.getElementById(
      "applicationsTableBody"
    );

  tableBody.innerHTML = "";

data.applications.forEach(app => {

  tableBody.innerHTML += `
    <tr>

      <td>
        ${app.studentId?.fullName || "N/A"}
      </td>

      <td>
        ${app.jobId?.companyId?.name || "N/A"}
      </td>

      <td>
        ${app.jobId?.title || "N/A"}
      </td>

      <td>
        ${app.status}
      </td>

    </tr>
  `;

});

}

document
.getElementById("companyForm")
.addEventListener(
"submit",
async function(e){

  e.preventDefault();

  const name =
    document.getElementById(
      "companyName"
    ).value;

  const email =
    document.getElementById(
      "companyEmail"
    ).value;

  const password =
    document.getElementById(
      "companyPassword"
    ).value;

  const response =
    await fetch(
      "/api/auth/register",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          name,
          email,
          password,
          role:"company"
        })
      }
    );

  const data =
    await response.json();

  if(data.success){

    alert(
      "Company Created"
    );

    document
      .getElementById(
        "companyForm"
      )
      .reset();

    loadCompanies();

  } else {

    alert(
      data.message
    );

  }

});

function logout(){

  localStorage.clear();

  window.location.href =
  "login.html";

}

async function loadAnalytics() {

  const response =
    await fetch(
      "/api/dashboard/summary"
    );

  const data =
    await response.json();

  const ctx1 =
    document
    .getElementById("applicationChart");

  new Chart(ctx1, {

    type: "bar",

    data: {

      labels: [
        "Applications",
        "Selected",
        "Rejected",
        "Shortlisted"
      ],

      datasets: [{
        label: "Applications",

        data: [
          data.applications,
          data.selected,
          data.rejected,
          data.shortlisted
        ]
      }]
    }
  });

  const ctx2 =
    document
    .getElementById("placementChart");

  new Chart(ctx2, {

    type: "pie",

    data: {

      labels: [
        "Placed",
        "Not Placed"
      ],

      datasets: [{

        data: [
          data.selected,
          data.students -
          data.selected
        ]

      }]
    }

  });

}

async function deleteStudent(studentId){

const confirmDelete =
confirm(
"Delete this student?"
);

if(!confirmDelete){
return;
}

try{

const token =
localStorage.getItem("token");

const response =
await fetch(
`/api/students/${studentId}`,
{
method:"DELETE",

headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

alert(data.message);

loadStudents();
loadDashboard();

}catch(error){

console.log(error);

}

}

loadDashboard();
loadStudents();
loadCompanies();
loadApplications();
loadAnalytics();

</script>


</body>
</html>
