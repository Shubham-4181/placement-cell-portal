<!DOCTYPE html>
<html>
<head>
  <title>Company Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">

    <span class="navbar-brand">
      Company Dashboard
    </span>

    <div>

      <a
        href="my-jobs.html"
        class="btn btn-success me-2"
      >
        My Jobs
      </a>

      <a
        href="add-job.html"
        class="btn btn-primary me-2"
      >
        Add New Job
      </a>

      <button
        class="btn btn-danger"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>
</nav>

<div class="container mt-5">

  <h2 id="companyName"></h2>

  <hr>

  <h3 class="mt-4">
    All Applicants
  </h3>

  <table class="table table-bordered table-striped">

    <thead class="table-dark">

   <tr>
  <th>Student Name</th>
  <th>Email</th>
  <th>Job Title</th>
  <th>Status</th>
  <th>Resume</th>
  <th>Action</th>
</tr>

    </thead>

    <tbody id="applicantsTable">

    </tbody>

  </table>

</div>

<script>

async function loadApplicants() {

  try {

    const response =
      await fetch(
"/api/applications/company-applicants",
{
  headers:{
    Authorization:
    `Bearer ${localStorage.getItem("token")}`
  }
}
)

    const data =
      await response.json();

    const table =
      document.getElementById(
        "applicantsTable"
      );

    table.innerHTML = "";

    data.applications.forEach(app => {

      table.innerHTML += `
<tr>

  <td>${app.studentId?.fullName || "N/A"}</td>

  <td>${app.studentId?.email || "N/A"}</td>

  <td>${app.jobId?.title || "N/A"}</td>

  <td>${app.status}</td>

  <td>

  ${
    app.studentId?.resumeUrl
      ?
      `<a
        href="/uploads/${app.studentId.resumeUrl}"
        target="_blank"
        class="btn btn-info btn-sm"
      >
        View Resume
      </a>`
      :
      "No Resume"
  }

</td>

  <td>

    <button
      class="btn btn-success btn-sm"
      onclick="updateStatus(
        '${app._id}',
        'Shortlisted'
      )"
    >
      Shortlist
    </button>

    <button
      class="btn btn-danger btn-sm"
      onclick="updateStatus(
        '${app._id}',
        'Rejected'
      )"
    >
      Reject
    </button>

    <button
  class="btn btn-primary btn-sm"
  onclick="updateStatus(
    '${app._id}',
    'Selected'
  )"
>
  Select
</button>

  </td>

</tr>
`;

    });

  } catch (error) {

    console.log(error);

  }

}

document.getElementById("companyName").innerText =
"Welcome " +
(localStorage.getItem("userName") || "Company");

async function updateStatus(
  applicationId,
  status
) {

  try {

    const response =
      await fetch(
        `/api/applications/${applicationId}`,
        {
          method: "PUT",
          headers: {
            "Content-Type":
            "application/json"
          },
          body: JSON.stringify({
            status
          })
        }
      );

    const data =
      await response.json();

    if (data.success) {

      alert(
        "Status Updated"
      );

      loadApplicants();

    }

  } catch (error) {

    console.log(error);

  }

}

function logout() {

  localStorage.clear();

  window.location.href =
    "login.html";

}

loadApplicants();

</script>

</body>
</html>
