<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Dashboard</title>

  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-speedometer2 me-2"></i>Company Dashboard
    </span>

    <div class="d-flex align-items-center gap-2">
      <a href="my-jobs.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-briefcase me-1"></i>My Jobs
      </a>
      <a href="add-job.html" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle me-1"></i>Add New Job
      </a>
      <button class="btn btn-danger btn-sm" onclick="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 id="companyName" class="h3 fw-bold mb-1">Welcome</h2>
      <p class="text-muted mb-0">Manage applicant statuses and review resumes.</p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
      <h5 class="card-title mb-0 fw-bold">All Applicants</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Student Name</th>
              <th>Email</th>
              <th>Job Title</th>
              <th>Status</th>
              <th>Resume</th>
              <th class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody id="applicantsTable">
            <!-- Loading Indicator Dynamic Insert -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// Escape plain text helper (prevents XSS vulnerabilities)
function createTextNode(text) {
  return document.createTextNode(text || "N/A");
}

// Map Application Status to Bootstrap Badges
function getStatusBadge(status) {
  const badge = document.createElement("span");
  badge.className = "badge rounded-pill ";

  switch ((status || "").toLowerCase()) {
    case "shortlisted":
      badge.className += "bg-warning text-dark";
      break;
    case "selected":
      badge.className += "bg-success";
      break;
    case "rejected":
      badge.className += "bg-danger";
      break;
    default:
      badge.className += "bg-secondary";
      break;
  }
  badge.textContent = status || "Pending";
  return badge;
}

// Render Applicants Table safely
async function loadApplicants() {
  const table = document.getElementById("applicantsTable");
  table.innerHTML = `
    <tr>
      <td colspan="6" class="text-center py-4 text-muted">
        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
        Loading applicants...
      </td>
    </tr>
  `;

  try {
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
      return;
    }

    const response = await fetch("/api/applications/company-applicants", {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!response.ok) throw new Error(`Error ${response.status}: Failed to fetch`);

    const data = await response.json();
    table.innerHTML = ""; // Clear table body

    if (!data.applications || data.applications.length === 0) {
      table.innerHTML = `
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">
            No applicants found.
          </td>
        </tr>
      `;
      return;
    }

    const fragment = document.createDocumentFragment();

    data.applications.forEach(app => {
      const tr = document.createElement("tr");

      // Student Name
      const tdName = document.createElement("td");
      tdName.className = "fw-medium";
      tdName.appendChild(createTextNode(app.studentId?.fullName));

      // Student Email
      const tdEmail = document.createElement("td");
      tdEmail.appendChild(createTextNode(app.studentId?.email));

      // Job Title
      const tdJob = document.createElement("td");
      tdJob.appendChild(createTextNode(app.jobId?.title));

      // Status
      const tdStatus = document.createElement("td");
      tdStatus.appendChild(getStatusBadge(app.status));

      // Resume Link
      const tdResume = document.createElement("td");
      if (app.studentId?.resumeUrl) {
        const resumeBtn = document.createElement("a");
        resumeBtn.href = `/uploads/${app.studentId.resumeUrl}`;
        resumeBtn.target = "_blank";
        resumeBtn.rel = "noopener noreferrer";
        resumeBtn.className = "btn btn-outline-info btn-sm";
        resumeBtn.innerHTML = '<i class="bi bi-file-earmark-pdf me-1"></i>View Resume';
        tdResume.appendChild(resumeBtn);
      } else {
        const span = document.createElement("span");
        span.className = "text-muted small";
        span.textContent = "No Resume";
        tdResume.appendChild(span);
      }

      // Actions
      const tdActions = document.createElement("td");
      tdActions.className = "text-end pe-4";

      const btnGroup = document.createElement("div");
      btnGroup.className = "btn-group btn-group-sm";

      // Shortlist Button
      const btnShortlist = document.createElement("button");
      btnShortlist.className = "btn btn-outline-warning";
      btnShortlist.textContent = "Shortlist";
      btnShortlist.onclick = () => updateStatus(app._id, "Shortlisted", btnGroup);

      // Select Button
      const btnSelect = document.createElement("button");
      btnSelect.className = "btn btn-outline-success";
      btnSelect.textContent = "Select";
      btnSelect.onclick = () => updateStatus(app._id, "Selected", btnGroup);

      // Reject Button
      const btnReject = document.createElement("button");
      btnReject.className = "btn btn-outline-danger";
      btnReject.textContent = "Reject";
      btnReject.onclick = () => updateStatus(app._id, "Rejected", btnGroup);

      btnGroup.appendChild(btnShortlist);
      btnGroup.appendChild(btnSelect);
      btnGroup.appendChild(btnReject);
      tdActions.appendChild(btnGroup);

      // Append cells to row
      tr.appendChild(tdName);
      tr.appendChild(tdEmail);
      tr.appendChild(tdJob);
      tr.appendChild(tdStatus);
      tr.appendChild(tdResume);
      tr.appendChild(tdActions);

      fragment.appendChild(tr);
    });

    table.appendChild(fragment);

  } catch (error) {
    console.error("Fetch applicants error:", error);
    table.innerHTML = `
      <tr>
        <td colspan="6" class="text-center py-4 text-danger">
          Failed to load applicants. Please try again later.
        </td>
      </tr>
    `;
  }
}

// Update Status Handler
async function updateStatus(applicationId, status, containerElement) {
  try {
    const token = localStorage.getItem("token");
    if (containerElement) containerElement.style.pointerEvents = "none"; // Disable buttons during request

    const response = await fetch(`/api/applications/${applicationId}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ status })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      await loadApplicants(); // Refresh list
    } else {
      alert(data.message || "Failed to update status.");
    }
  } catch (error) {
    console.error("Status update error:", error);
    alert("An error occurred while updating status.");
  } finally {
    if (containerElement) containerElement.style.pointerEvents = "auto";
  }
}

// Logout Action
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

// Initialize Dashboard
document.addEventListener("DOMContentLoaded", () => {
  const userName = localStorage.getItem("userName") || "Company";
  document.getElementById("companyName").textContent = `Welcome, ${userName}`;
  loadApplicants();
});
</script>

</body>
</html>
