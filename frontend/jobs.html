<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body>

<div class="container mt-4">

  <a
    href="student-dashboard.html"
    class="btn btn-secondary mb-3"
  >
    ← Back to Dashboard
  </a>

  <div class="mb-3">

    <input
      type="text"
      id="searchBox"
      class="form-control"
      placeholder="Search Job / Skill"
    />

  </div>

  <div class="row mb-3">

<div class="col-md-6">

<input
type="number"
id="packageFilter"
class="form-control"
placeholder="Minimum Package"
/>

</div>

<div class="col-md-6">

<input
type="text"
id="skillFilter"
class="form-control"
placeholder="Filter By Skill"
/>

</div>

<div>
<select
id="sortOption"
class="form-select"
onchange="sortJobs()"
>
<option value="">
Sort Jobs
</option>

<option value="high">
Highest Package
</option>

<option value="low">
Lowest Package
</option>

<option value="new">
Newest Jobs
</option>

</select>

</div>

</div>

<button
class="btn btn-primary mb-3"
onclick="filterJobs()"
>
Apply Filters
</button>

<button
class="btn btn-secondary mb-3 ms-2"
onclick="loadJobs()"
>
Reset
</button>

  <h2 class="mb-4">
    Available Jobs
  </h2>

  <div id="jobsContainer"></div>

</div>

<script>

document
.getElementById("searchBox")
.addEventListener(
  "keyup",
  searchJobs
);

function displayJobs(jobs) {

  const jobsContainer =
  document.getElementById(
    "jobsContainer"
  );

  jobsContainer.innerHTML = "";

  if(jobs.length === 0){

    jobsContainer.innerHTML = `
      <div class="alert alert-warning">
        No Jobs Found
      </div>
    `;

    return;
  }

  jobs.forEach(job => {

    jobsContainer.innerHTML += `

      <div class="card mb-3">

        <div class="card-body">

          <p>
            <strong>Company:</strong>
            ${job.companyId?.name || "N/A"}
          </p>

          <h4>
            ${job.title}
          </h4>

          <p>
            ${job.description}
          </p>

          <p>
            <strong>Package:</strong>
            ₹${job.package || 0}
          </p>

          <p>
            <strong>Skills:</strong>
            ${
              job.skills &&
              job.skills.length > 0
              ? job.skills.join(", ")
              : "N/A"
            }
          </p>

          <button
            class="btn btn-success"
            onclick="applyJob('${job._id}')"
          >
            Apply
          </button>

        </div>

      </div>

    `;

  });

}

async function searchJobs() {

  try{

    const keyword =
    document.getElementById(
      "searchBox"
    ).value;

    if(keyword.trim() === ""){

      loadJobs();
      return;

    }

    const response =
    await fetch(
      `/api/jobs/search?search=${keyword}`
    );

    const data =
    await response.json();

    displayJobs(
      data.jobs || []
    );

  }catch(error){

    console.log(error);

  }

}

async function loadJobs() {

  try{

    const response =
    await fetch(
      "/api/jobs"
    );

    const data =
    await response.json();

    displayJobs(
      data.jobs || []
    );

  }catch(error){

    console.log(error);

  }

}

async function applyJob(jobId) {

  try{

    const userId =
    localStorage.getItem(
      "userId"
    );

    const studentResponse =
    await fetch(
      `/api/students/user/${userId}`
    );

    const studentData =
    await studentResponse.json();

    if(
      !studentData.student ||
      !studentData.student.resumeUrl
    ){

      alert(
        "Please upload your resume before applying."
      );

      window.location.href =
      "student-dashboard.html";

      return;

    }

    const response =
    await fetch(
      "/api/applications",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          studentId:
          localStorage.getItem(
            "studentId"
          ),

          jobId

        })

      }
    );

    const data =
    await response.json();

    if(data.success){

      alert(
        "Application Submitted Successfully"
      );

    }else{

      alert(
        data.message ||
        "Failed To Apply"
      );

    }

  }catch(error){

    console.log(error);

    alert(
      "Something Went Wrong"
    );

  }

}

async function filterJobs(){

const packageValue =
document.getElementById(
"packageFilter"
).value;

const skill =
document.getElementById(
"skillFilter"
).value;

const response =
await fetch(
`/api/jobs/filter?package=${packageValue}&skill=${skill}`
);

const data =
await response.json();

displayJobs(
data.jobs
);

}

async function sortJobs(){

const sort =
document.getElementById(
"sortOption"
).value;

const response =
await fetch(
`/api/jobs/sort?sort=${sort}`
);

const data =
await response.json();

displayJobs(
data.jobs
);

}

loadJobs();

</script>

</body>
</html>
