<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>

<body class="bg-light">

<div class="container my-4">

  <a href="student-dashboard.html" class="btn btn-outline-secondary mb-3">
    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
  </a>

  <!-- Filters Card -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <!-- Search Input -->
        <div class="col-12">
          <label for="searchBox" class="form-label fw-semibold">Search</label>

          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="searchBox" class="form-control" placeholder="Search Job Title / Skill..." />
          </div>
        </div>

        <!-- Package Filter -->
        <div class="col-md-4">
          <label for="packageFilter" class="form-label fw-semibold">Minimum Package (LPA/₹)</label>
          <input type="number" id="packageFilter" class="form-control" placeholder="e.g. 500000" />
        </div>

        <!-- Skill Filter -->
        <div class="col-md-4">
          <label for="skillFilter" class="form-label fw-semibold">Skill</label>
          <input type="text" id="skillFilter" class="form-control" placeholder="e.g. Node.js" />
        </div>

        <!-- Sort Filter -->
        <div class="col-md-4">
          <label for="sortOption" class="form-label fw-semibold">Sort By</label>
          <select id="sortOption" class="form-select" onchange="sortJobs()">
            <option value="">Default Sort</option>
            <option value="high">Highest Package</option>
            <option value="low">Lowest Package</option>
            <option value="new">Newest Jobs</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" onclick="filterJobs()">
          <i class="bi bi-funnel me-1"></i> Apply Filters
        </button>
        <button class="btn btn-secondary" onclick="resetFilters()">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
        </button>
      </div>
    </div>
  </div>

  <h2 class="h4 mb-3">Available Jobs</h2>

  <!-- Container for jobs output -->
  <div id="jobsContainer"></div>

</div>

<script>
// --- Event Listeners ---
document.getElementById("searchBox").addEventListener("keyup", debounce(searchJobs, 300));

// --- Debounce Utility ---
function debounce(func, delay) {
  let timeout;
  return function (...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), delay);
  };
}

// --- Display Loading Spinner ---
function showLoading() {
  const jobsContainer = document.getElementById("jobsContainer");
  jobsContainer.innerHTML = `
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  `;
}

// --- Render Jobs ---
function displayJobs(jobs) {
  const jobsContainer = document.getElementById("jobsContainer");
  jobsContainer.innerHTML = "";

  if (!jobs || jobs.length === 0) {
    jobsContainer.innerHTML = `
      <div class="alert alert-warning text-center py-4" role="alert">
        <i class="bi bi-exclamation-circle fs-4 d-block mb-2"></i>
        No Jobs Found
      </div>
    `;
    return;
  }

  const jobCards = jobs.map(job => {
    const companyName = job.companyId?.name || "N/A";
    const skillsList = job.skills && job.skills.length > 0
      ? job.skills.map(skill => `<span class="badge bg-secondary-subtle text-secondary me-1">${skill}</span>`).join('')
      : '<span class="text-muted">N/A</span>';

    return `
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <h5 class="card-title text-primary mb-1">${job.title || 'Untitled Position'}</h5>
              <p class="card-subtitle text-muted fw-bold">
                <i class="bi bi-building me-1"></i>${companyName}
              </p>
            </div>
            <span class="badge bg-success-subtle text-success fs-6 fw-bold">
              ₹${Number(job.package || 0).toLocaleString('en-IN')}
            </span>
          </div>

          <p class="card-text text-secondary mb-3">${job.description || 'No description provided.'}</p>

          <div class="mb-3">
            <strong class="d-block mb-1 text-dark small">Required Skills:</strong>
            <div>${skillsList}</div>
          </div>

          <button class="btn btn-success" onclick="applyJob('${job._id}', this)">
            <i class="bi bi-send me-1"></i> Apply Now
          </button>
        </div>
      </div>
    `;
  }).join('');

  jobsContainer.innerHTML = jobCards;
}

// --- API Calls ---
async function searchJobs() {
  const keyword = document.getElementById("searchBox").value.trim();

  if (keyword === "") {
    loadJobs();
    return;
  }

  try {
    showLoading();
    const response = await fetch(`/api/jobs/search?search=${encodeURIComponent(keyword)}`);
    const data = await response.json();
    displayJobs(data.jobs || []);
  } catch (error) {
    console.error("Search error:", error);
  }
}

async function loadJobs() {
  try {
    showLoading();
    const response = await fetch("/api/jobs");
    const data = await response.json();
    displayJobs(data.jobs || []);
  } catch (error) {
    console.error("Error loading jobs:", error);
  }
}

async function filterJobs() {
  const packageValue = document.getElementById("packageFilter").value;
  const skill = document.getElementById("skillFilter").value.trim();

  try {
    showLoading();
    const response = await fetch(`/api/jobs/filter?package=${packageValue}&skill=${encodeURIComponent(skill)}`);
    const data = await response.json();
    displayJobs(data.jobs || []);
  } catch (error) {
    console.error("Filter error:", error);
  }
}

async function sortJobs() {
  const sort = document.getElementById("sortOption").value;
  if (!sort) return;

  try {
    showLoading();
    const response = await fetch(`/api/jobs/sort?sort=${sort}`);
    const data = await response.json();
    displayJobs(data.jobs || []);
  } catch (error) {
    console.error("Sort error:", error);
  }
}

function resetFilters() {
  document.getElementById("searchBox").value = "";
  document.getElementById("packageFilter").value = "";
  document.getElementById("skillFilter").value = "";
  document.getElementById("sortOption").value = "";
  loadJobs();
}

async function applyJob(jobId, btnElement) {
  try {
    const userId = localStorage.getItem("userId");
    const studentId = localStorage.getItem("studentId");

    if (!userId || !studentId) {
      alert("Session invalid. Please log in again.");
      return;
    }

    btnElement.disabled = true;
    btnElement.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Applying...`;

    const studentResponse = await fetch(`/api/students/user/${userId}`);
    const studentData = await studentResponse.json();

    if (!studentData.student?.resumeUrl) {
      alert("Please upload your resume before applying.");
      window.location.href = "student-dashboard.html";
      return;
    }

    const response = await fetch("/api/applications", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId, jobId })
    });

    const data = await response.json();

    if (data.success) {
      alert("Application Submitted Successfully");
      btnElement.innerText = "Applied";
      btnElement.classList.replace("btn-success", "btn-secondary");
    } else {
      alert(data.message || "Failed To Apply");
      btnElement.disabled = false;
      btnElement.innerHTML = `<i class="bi bi-send me-1"></i> Apply Now`;
    }
  } catch (error) {
    console.error("Apply error:", error);
    alert("Something Went Wrong");
    btnElement.disabled = false;
    btnElement.innerHTML = `<i class="bi bi-send me-1"></i> Apply Now`;
  }
}

// Initial Load
loadJobs();
</script>

</body>
</html>
