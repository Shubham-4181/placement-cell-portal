<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" 
    rel="stylesheet"
  />
</head>

<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-sm-5">

            <h3 class="card-title text-center fw-bold mb-4">Welcome Back</h3>

            <!-- Dynamic Alert for Success / Error messages -->
            <div id="alertContainer"></div>

            <form id="loginForm" novalidate>

              <!-- Email Field -->
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="name@example.com"
                  autocomplete="username"
                  required
                />
              </div>

              <!-- Password Field -->
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                  />
                  <button 
                    class="btn btn-outline-secondary" 
                    type="button" 
                    id="togglePassword"
                    aria-label="Toggle password visibility"
                  >
                    <i class="bi bi-eye" id="toggleIcon"></i>
                  </button>
                </div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                id="submitBtn"
                class="btn btn-primary w-100 py-2 mt-2 fw-semibold"
              >
                <span id="btnText">Login</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
              </button>

              <!-- Registration Link -->
              <div class="text-center mt-4">
                <span class="text-muted small">Don't have an account?</span>
                <a href="register.html" class="text-decoration-none fw-semibold ms-1">Create New Account</a>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Elements
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const toggleIcon = document.getElementById("toggleIcon");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const alertContainer = document.getElementById("alertContainer");

    // Role-to-Dashboard Redirect Mapping
    const dashboardMap = {
      student: "student-dashboard.html",
      admin: "admin-dashboard.html",
      company: "company-dashboard.html"
    };

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleIcon.classList.toggle("bi-eye", !isPassword);
      toggleIcon.classList.toggle("bi-eye-slash", isPassword);
    });

    // Helper: Display Bootstrap Alert Banner
    function showAlert(message, type = "danger") {
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }

    // Helper: Set Button Loading State
    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = "Logging in...";
        btnSpinner.classList.remove("d-none");
      } else {
        btnText.textContent = "Login";
        btnSpinner.classList.add("d-none");
      }
    }

    // Form Submit Handler
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = ""; // Clear existing alerts

      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert("Please fill in all fields.");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert("Login successful! Redirecting...", "success");

          // Store auth state
          localStorage.setItem("token", data.token);
          localStorage.setItem("userId", data.userId);
          localStorage.setItem("role", data.role);
          localStorage.setItem("userName", data.name);

          // Redirect based on role or fall back to default
          const redirectUrl = dashboardMap[data.role] || "dashboard.html";
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 800);

        } else {
          showAlert(data.message || "Invalid credentials. Please try again.");
        }

      } catch (error) {
        console.error("Login error:", error);
        showAlert("Unable to connect to the server. Please check your network and try again.");
      } finally {
        setLoading(false);
      }
    });
  </script>

  <!-- Optional Bootstrap JS for dismissal of alert component -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
