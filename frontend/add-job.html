<!DOCTYPE html>
<html>
<head>

<title>Add Job</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>

<body>

<div class="container mt-5">

<h2>Add New Job</h2>

<form id="jobForm">

<input
type="text"
id="title"
class="form-control mb-3"
placeholder="Job Title"
required
>

<textarea
id="description"
class="form-control mb-3"
placeholder="Job Description"
required
></textarea>

<input
type="number"
id="package"
class="form-control mb-3"
placeholder="Package"
required
>

<button
type="submit"
class="btn btn-success"
>
Add Job
</button>

</form>

</div>

<script>

document
.getElementById("jobForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const token =
localStorage.getItem("token");

const title =
document.getElementById("title").value;

const description =
document.getElementById("description").value;

const packageValue =
document.getElementById("package").value;

const response =
await fetch(
"http://localhost:8080/api/jobs",
{
method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:
`Bearer ${token}`
},

body:JSON.stringify({
title,
description,
package:packageValue
})
}
);

const data =
await response.json();

if(data.success){

alert("Job Added Successfully");

window.location.href =
"company-dashboard.html";

}else{

alert("Failed");

}

});

</script>

</body>
</html>
