<!DOCTYPE html>
<html>
<head>

<title>Add Job</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>

<body>

<div class="container mt-5">

<h2>Add New Job</h2>

<form id="jobForm">

<input
type="text"
id="title"
class="form-control mb-3"
placeholder="Job Title"
required
>

<textarea
id="description"
class="form-control mb-3"
placeholder="Job Description"
required
></textarea>

<input
type="number"
id="package"
class="form-control mb-3"
placeholder="Package"
required
>

<input
type="text"
id="skills"
class="form-control mb-3"
placeholder="Skills (comma separated)"
required
>

<button
type="submit"
class="btn btn-success"
>
Add Job
</button>

</form>

</div>

<script>

document
.getElementById("jobForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

try{

const token =
localStorage.getItem("token");

if(!token){

alert("Please Login First");
window.location.href =
"login.html";

return;

}

const title =
document.getElementById("title").value;

const description =
document.getElementById("description").value;

const packageValue =
document.getElementById("package").value;

const skills =
document.getElementById("skills")
.value
.split(",")
.map(skill => skill.trim())
.filter(skill => skill !== "");

const response =
await fetch(
"/api/jobs",
{
method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:
`Bearer ${token}`
},

body:JSON.stringify({
title,
description,
package: packageValue,
skills
})
}
);

const data =
await response.json();

if(data.success){

alert("Job Added Successfully");

document
.getElementById("jobForm")
.reset();

window.location.href =
"company-dashboard.html";

}else{

alert(
data.message ||
"Failed To Add Job"
);

}

}catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

});

</script>

</body>
</html>
