<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Jobs</title>

  <!-- Bootstrap 5 CSS & Icons CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
</head>

<body class="bg-light">

<div class="container my-5">
  <!-- Header & Back Navigation -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h3 fw-bold mb-1">My Posted Jobs</h2>
      <p class="text-muted mb-0">Manage and remove job listings created by your company.</p>
    </div>
    <a href="company-dashboard.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </a>
  </div>

  <!-- Jobs Container -->
  <div id="jobsContainer">
    <!-- Dynamic Loading / Cards Insertion -->
  </div>
</div>

<script>
// Helper to format currency numbers safely
function formatPackage(pkg) {
  if (!pkg) return "N/A";
  const num = Number(pkg);
  return isNaN(num) ? pkg : `₹${num.toLocaleString("en-IN")}`;
}

async function loadJobs() {
  const container = document.getElementById("jobsContainer");
  
  // Show Loading Spinner
  container.innerHTML = `
    <div class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
      Loading your posted jobs...
    </div>
  `;

  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {
    const response = await fetch("/api/jobs/my-jobs", {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    if (!response.ok) {
      throw new Error(`Server returned error status ${response.status}`);
    }

    const data = await response.json();
    container.innerHTML = ""; // Clear loader

    if (!data.jobs || data.jobs.length === 0) {
      container.innerHTML = `
        <div class="card border-0 shadow-sm text-center py-5">
          <div class="card-body">
            <i class="bi bi-briefcase text-muted display-6 mb-3 d-block"></i>
            <h5 class="fw-bold">No Jobs Posted Yet</h5>
            <p class="text-muted small">You haven't posted any job openings for candidates.</p>
            <a href="add-job.html" class="btn btn-primary btn-sm mt-2">
              <i class="bi bi-plus-circle me-1"></i> Post a Job Now
            </a>
          </div>
        </div>
      `;
      return;
    }

    const fragment = document.createDocumentFragment();

    data.jobs.forEach(job => {
      const card = document.createElement("div");
      card.className = "card shadow-sm border-0 mb-3";

      const cardBody = document.createElement("div");
      cardBody.className = "card-body p-4 d-flex justify-content-between align-items-start gap-3";

      const contentCol = document.createElement("div");
      contentCol.className = "flex-grow-1";

      // Job Title
      const title = document.createElement("h4");
      title.className = "h5 fw-bold mb-2";
      title.textContent = job.title || "Untitled Position";

      // Package Badge
      const pkgBadge = document.createElement("span");
      pkgBadge.className = "badge bg-success-subtle text-success border border-success-subtle mb-3";
      pkgBadge.innerHTML = `<i class="bi bi-currency-rupee me-1"></i>Package: ${formatPackage(job.package)}`;

      // Description
      const desc = document.createElement("p");
      desc.className = "card-text text-secondary mb-0";
      desc.textContent = job.description || "No description provided.";

      contentCol.appendChild(title);
      contentCol.appendChild(pkgBadge);
      contentCol.appendChild(desc);

      // Action Column (Delete button)
      const actionCol = document.createElement("div");
      actionCol.className = "text-end ms-3";

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "btn btn-outline-danger btn-sm";
      deleteBtn.innerHTML = `<i class="bi bi-trash me-1"></i> Delete Job`;
      deleteBtn.onclick = () => deleteJob(job._id, deleteBtn);

      actionCol.appendChild(deleteBtn);

      cardBody.appendChild(contentCol);
      cardBody.appendChild(actionCol);
      card.appendChild(cardBody);

      fragment.appendChild(card);
    });

    container.appendChild(fragment);

  } catch (error) {
    console.error("Load jobs error:", error);
    container.innerHTML = `
      <div class="alert alert-danger shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> Failed to load jobs. Please check your connection and try again.
      </div>
    `;
  }
}

async function deleteJob(jobId, buttonElement) {
  const confirmDelete = confirm("Are you sure you want to delete this job? This action cannot be undone.");
  if (!confirmDelete) return;

  const token = localStorage.getItem("token");

  // Disable button and show loading state
  if (buttonElement) {
    buttonElement.disabled = true;
    buttonElement.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status"></span> Deleting...`;
  }

  try {
    const response = await fetch(`/api/jobs/${jobId}`, {
      method: "DELETE",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const data = await response.json();

    if (response.ok) {
      loadJobs(); // Refresh job list after deletion
    } else {
      alert(data.message || "Failed to delete job.");
      if (buttonElement) {
        buttonElement.disabled = false;
        buttonElement.innerHTML = `<i class="bi bi-trash me-1"></i> Delete Job`;
      }
    }
  } catch (error) {
    console.error("Delete job error:", error);
    alert("An error occurred while deleting the job.");
    if (buttonElement) {
      buttonElement.disabled = false;
      buttonElement.innerHTML = `<i class="bi bi-trash me-1"></i> Delete Job`;
    }
  }
}

// Initial Call on Load
document.addEventListener("DOMContentLoaded", loadJobs);
</script>

</body>
</html>
