<!DOCTYPE html>

<html>
<head>
<title>My Jobs</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

</head>

<body>

<div class="container mt-4">

<h2>My Jobs</h2>

<a
href="company-dashboard.html"
class="btn btn-secondary mb-3"

>

← Back to Dashboard </a>

<div id="jobsContainer"></div>

</div>

<script>

async function loadJobs() {

const token =
localStorage.getItem("token");

const response =
await fetch(
"/api/jobs/my-jobs",
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

const container =
document.getElementById(
"jobsContainer"
);

container.innerHTML = "";

if(
!data.jobs ||
data.jobs.length === 0
){

container.innerHTML = `
<div class="alert alert-info">
No Jobs Posted Yet
</div>
`;

return;

}

data.jobs.forEach(job => {

container.innerHTML += `
<div class="card mb-3">

<div class="card-body">

<h4>${job.title}</h4>

<p>${job.description}</p>

<p>
Package:
₹${job.package}
</p>

<button
class="btn btn-danger"
onclick="deleteJob('${job._id}')"
>
Delete Job
</button>

</div>

</div>
`;

});

}

async function deleteJob(jobId) {

const confirmDelete =
confirm(
"Are you sure you want to delete this job?"
);

if(!confirmDelete){
return;
}

const token =
localStorage.getItem("token");

const response =
await fetch(
`/api/jobs/${jobId}`,
{
method:"DELETE",

headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

alert(
data.message ||
"Job Deleted Successfully"
);

loadJobs();

}

loadJobs();

</script>

</body>
</html>
